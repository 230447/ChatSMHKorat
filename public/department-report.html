<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานแผนก - โรงพยาบาลเซนต์เมรี่</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* ===== ปรับสำหรับการพิมพ์ A4 ===== */
        @page {
            size: A4;
            margin: 1.5cm 1.5cm 1.5cm 1.5cm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            font-family: 'Sarabun', sans-serif;
            color: #1a2533;
            min-height: 100vh;
            padding: 24px 16px 40px;
        }

        /* Toolbar - ไม่แสดงเวลาพิมพ์ */
        .toolbar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .toolbar button {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-family: 'Sarabun', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.3s;
        }

        .toolbar button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .btn-back { background: #f8f9fa; color: #2d3748; }
        .btn-refresh { background: #e8a020; color: white; }
        .btn-print { background: #1e5799; color: white; }
        .btn-pdf { background: #27ae60; color: white; }

        /* Main Paper - ปรับสเกลให้พอดี A4 */
        .paper {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            overflow: hidden;
            /* เผื่อขอบเวลาพิมพ์ */
            page-break-after: avoid;
            page-break-inside: avoid;
        }

        /* Header Gradient */
        .header-gradient {
            background: linear-gradient(135deg, #1a3a5c 0%, #1e5799 50%, #2980b9 100%);
            padding: 40px 40px 30px;
            position: relative;
            color: white;
            /* สำหรับการพิมพ์ */
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .hospital-badge {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.15);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
        }

        .hospital-name h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .hospital-name p {
            font-size: 14px;
            opacity: 0.8;
        }

        .report-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .dept-tag {
            text-align: center;
            margin-bottom: 30px;
        }

        .dept-tag span {
            background: rgba(232,160,32,0.3);
            border: 2px solid #e8a020;
            border-radius: 40px;
            padding: 8px 30px;
            font-size: 20px;
            font-weight: 600;
            color: #fff3d6;
        }

        /* Date Range Picker - ไม่แสดงเวลาพิมพ์ */
        .date-range-picker {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .date-range-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .date-range-title i {
            color: #e8a020;
        }

        .date-inputs {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .date-field {
            flex: 1;
            min-width: 180px;
        }

        .date-field label {
            display: block;
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .date-field input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-family: 'Sarabun', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }

        .date-field input:focus {
            outline: none;
            border-color: #e8a020;
            background: rgba(255,255,255,0.2);
        }

        .date-field input::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
        }

        .btn-apply-date {
            background: #e8a020;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            height: 42px;
        }

        .btn-apply-date:hover {
            background: #d48c0c;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(232,160,32,0.3);
        }

        .preset-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 6px 15px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #e8a020;
        }

        .preset-btn.active {
            background: #e8a020;
            border-color: #e8a020;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
            /* สำหรับการพิมพ์ */
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .stat-icon {
            font-size: 24px;
            margin-bottom: 8px;
            color: #e8a020;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* Content Area */
        .content-area {
            padding: 40px;
        }

        /* Date Info */
        .date-info {
            background: #f7fafc;
            border-radius: 15px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-left: 5px solid #1e5799;
        }

        .date-info i {
            color: #1e5799;
            margin-right: 8px;
        }

        .date-range-badge {
            background: #e8a02020;
            color: #b45b0f;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Section */
        .section {
            margin-bottom: 35px;
            /* ป้องกันการตัดกลางหน้าเวลาพิมพ์ */
            page-break-inside: avoid;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }

        .section-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .icon-blue { background: #dbeafe; color: #1e4b8f; }
        .icon-orange { background: #feebc8; color: #c05621; }
        .icon-green { background: #c6f6d5; color: #22543d; }

        .section-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1a3a5c;
        }

        /* Topic Card */
        .topic-card {
            background: linear-gradient(135deg, #ebf4ff 0%, #e6f0fa 100%);
            border-left: 5px solid #1e5799;
            border-radius: 15px;
            padding: 25px;
            font-size: 16px;
            line-height: 1.8;
            color: #2d3748;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Appointment List */
        .appointment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .appointment-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            border-left: 4px solid #e8a020;
            transition: transform 0.2s;
        }

        .appointment-item:hover {
            transform: translateX(5px);
            background: #f1f5f9;
        }

        .appointment-time {
            background: #e8a02020;
            color: #b45b0f;
            font-weight: 600;
            font-size: 14px;
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .appointment-detail {
            flex: 1;
            font-size: 15px;
        }

        /* Tasks Table - ปรับให้แสดงใน A4 */
        .tasks-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            /* ป้องกันตารางถูกตัด */
            page-break-inside: avoid;
        }

        .tasks-table thead {
            background: #1a3a5c;
            color: white;
            /* ให้หัวตารางแสดงซ้ำทุกหน้าถ้าตารางยาว */
            display: table-header-group;
        }

        .tasks-table th {
            padding: 15px 20px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
        }

        .tasks-table td {
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .tasks-table tbody tr {
            page-break-inside: avoid;
        }

        .tasks-table tbody tr:hover {
            background: #f8fafc;
        }

        .owner-badge {
            background: #dbeafe;
            color: #1e4b8f;
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            background: #f8fafc;
            border-radius: 15px;
            color: #718096;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #cbd5e0;
        }

        /* Footer */
        .report-footer {
            background: #f8fafc;
            border-top: 2px solid #e2e8f0;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: #718096;
            /* ให้ footer อยู่ท้ายหน้าเสมอ */
            page-break-after: avoid;
        }

        .footer-left i {
            color: #1e5799;
            margin-right: 5px;
        }

        .footer-right {
            font-style: italic;
        }

        /* Loading/Error */
        .loading-state {
            text-align: center;
            padding: 80px 20px;
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== Print Styles - A4 ===== */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            
            .toolbar, .date-range-picker, .no-print {
                display: none !important;
            }
            
            .paper {
                max-width: 100%;
                box-shadow: none;
                border-radius: 0;
                margin: 0;
                page-break-after: avoid;
            }
            
            .header-gradient {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                background: linear-gradient(135deg, #1a3a5c 0%, #1e5799 50%, #2980b9 100%) !important;
            }
            
            .stat-card {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                background: rgba(255,255,255,0.1) !important;
                border: 1px solid rgba(255,255,255,0.2) !important;
            }
            
            .topic-card {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .tasks-table thead {
                background: #1a3a5c !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            /* ปรับขนาดตัวอักษรให้พอดี A4 */
            body, .paper, .content-area {
                font-size: 12pt;
            }
            
            h1 { font-size: 24pt; }
            h2 { font-size: 18pt; }
            h3 { font-size: 16pt; }
            
            .report-title {
                font-size: 28pt;
            }
            
            /* กันไม่ให้ section ถูกตัดกลาง */
            .section, .appointment-item, .tasks-table tr {
                page-break-inside: avoid;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .content-area {
                padding: 20px;
            }
            .toolbar {
                position: static;
                justify-content: center;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }
            .date-inputs {
                flex-direction: column;
            }
            .date-field {
                width: 100%;
            }
            .btn-apply-date {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="toolbar no-print">
    <button class="btn-back" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> กลับ
    </button>
    <button class="btn-refresh" onclick="loadReport()">
        <i class="fas fa-sync-alt"></i> รีเฟรช
    </button>
    <button class="btn-print" onclick="window.print()">
        <i class="fas fa-print"></i> พิมพ์
    </button>
    <button class="btn-pdf" onclick="downloadPDF()">
        <i class="fas fa-file-pdf"></i> PDF
    </button>
</div>

<div class="paper" id="reportContent">
    <!-- Header -->
    <div class="header-gradient">
        <div class="hospital-badge">
            <div class="logo">SMH</div>
            <div class="hospital-name">
                <h1>โรงพยาบาลเซนต์เมรี่ นครราชสีมา</h1>
                <p>Saint Mary's Hospital · Nakhon Ratchasima</p>
            </div>
        </div>

        <div class="report-title">📊 รายงานสรุปแผนก</div>
        
        <div class="dept-tag">
            <span id="deptNameDisplay">กำลังโหลด...</span>
        </div>

        <!-- Date Range Picker -->
        <div class="date-range-picker no-print">
            <div class="date-range-title">
                <i class="fas fa-calendar-alt"></i>
                <span>เลือกช่วงเวลาที่ต้องการดูรายงาน</span>
            </div>
            
            <div class="date-inputs">
                <div class="date-field">
                    <label>📅 วันที่เริ่มต้น</label>
                    <input type="date" id="startDateInput">
                </div>
                <div class="date-field">
                    <label>📅 วันที่สิ้นสุด</label>
                    <input type="date" id="endDateInput">
                </div>
                <button class="btn-apply-date" onclick="applyDateRange()">
                    <i class="fas fa-check"></i> แสดงรายงาน
                </button>
            </div>

            <!-- Preset Buttons -->
            <div class="preset-buttons">
                <button class="preset-btn" onclick="setDatePreset('today', this)">วันนี้</button>
                <button class="preset-btn" onclick="setDatePreset('yesterday', this)">เมื่อวาน</button>
                <button class="preset-btn" onclick="setDatePreset('week', this)">7 วันล่าสุด</button>
                <button class="preset-btn" onclick="setDatePreset('month', this)">30 วันล่าสุด</button>
                <button class="preset-btn" onclick="setDatePreset('thisMonth', this)">เดือนนี้</button>
                <button class="preset-btn" onclick="setDatePreset('lastMonth', this)">เดือนที่แล้ว</button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-comments"></i></div>
                <div class="stat-number" id="statMessages">0</div>
                <div class="stat-label">ข้อความทั้งหมด</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-number" id="statParticipants">0</div>
                <div class="stat-label">ผู้เข้าร่วม</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-calendar-check"></i></div>
                <div class="stat-number" id="statAppointments">0</div>
                <div class="stat-label">นัดหมาย</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-tasks"></i></div>
                <div class="stat-number" id="statTasks">0</div>
                <div class="stat-label">งานที่ต้องทำ</div>
            </div>
        </div>
    </div>

    <!-- Content Area -->
    <div class="content-area" id="contentArea">
        <div class="loading-state">
            <i class="fas fa-circle-notch fa-3x spin" style="color:#1e5799;"></i>
            <p style="margin-top: 20px; color: #4a5568;">กำลังโหลดข้อมูลแผนก...</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="report-footer">
        <div class="footer-left">
            <i class="fas fa-robot"></i> รายงานโดย AI อัตโนมัติ · ระบบจัดการแชท SMH
        </div>
        <div class="footer-right" id="footerTimestamp"></div>
    </div>
</div>

<script>
// ============================================
// Utility Functions
// ============================================
function goBack() {
    if (history.length > 1) {
        history.back();
    } else {
        window.location.href = '/chat';
    }
}

function formatThaiDate(date = new Date()) {
    return date.toLocaleDateString('th-TH', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        timeZone: 'Asia/Bangkok'
    });
}

function formatThaiDateTime(date = new Date()) {
    return date.toLocaleDateString('th-TH', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        timeZone: 'Asia/Bangkok'
    });
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================
// Date Range Functions
// ============================================
let currentStartDate = null;
let currentEndDate = null;

function setDatePreset(preset, element) {
    const today = new Date();
    let startDate = new Date();
    let endDate = new Date();

    switch(preset) {
        case 'today':
            startDate = new Date();
            endDate = new Date();
            break;
        case 'yesterday':
            startDate = new Date();
            startDate.setDate(today.getDate() - 1);
            endDate = new Date(startDate);
            break;
        case 'week':
            startDate.setDate(today.getDate() - 7);
            endDate = new Date();
            break;
        case 'month':
            startDate.setMonth(today.getMonth() - 1);
            endDate = new Date();
            break;
        case 'thisMonth':
            startDate = new Date(today.getFullYear(), today.getMonth(), 1);
            endDate = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            break;
        case 'lastMonth':
            startDate = new Date(today.getFullYear(), today.getMonth() - 1, 1);
            endDate = new Date(today.getFullYear(), today.getMonth(), 0);
            break;
    }

    // Format YYYY-MM-DD
    const formatDate = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    };

    document.getElementById('startDateInput').value = formatDate(startDate);
    document.getElementById('endDateInput').value = formatDate(endDate);
    
    // Highlight active preset
    document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
    if (element) element.classList.add('active');
    
    // Apply date range
    applyDateRange();
}

function applyDateRange() {
    const startDate = document.getElementById('startDateInput').value;
    const endDate = document.getElementById('endDateInput').value;
    
    if (!startDate || !endDate) {
        alert('กรุณาเลือกวันที่เริ่มต้นและสิ้นสุด');
        return;
    }
    
    if (new Date(startDate) > new Date(endDate)) {
        alert('วันที่เริ่มต้นต้องไม่เกินวันที่สิ้นสุด');
        return;
    }
    
    currentStartDate = startDate;
    currentEndDate = endDate;
    loadReport();
}

// ============================================
// Parse Summary Function
// ============================================
function parseDepartmentSummary(summaryText) {
    const result = {
        topic: 'ไม่มีข้อมูล',
        appointments: [],
        tasks: []
    };

    if (!summaryText) return result;

    try {
        // Extract Topic (🗣️ section)
        const topicMatch = summaryText.match(/🗣️[^:：]*[:：]\s*([^\n📅✅]+)/);
        if (topicMatch) {
            result.topic = topicMatch[1].replace(/\*\*/g, '').trim();
        }

        // Extract Appointments (📅 section) - ดึงทั้งหมด
        const apptMatch = summaryText.match(/📅[^:：\n]*[:：]\s*([\s\S]*?)(?=✅|---|$)/);
        if (apptMatch) {
            const apptText = apptMatch[1].trim();
            if (apptText && apptText !== 'ไม่มี' && !apptText.includes('ไม่มี')) {
                const lines = apptText.split('\n')
                    .filter(line => line.trim() && !line.includes('ไม่มี') && line.trim() !== '');
                
                result.appointments = lines.map(line => {
                    return line.replace(/^[•\-\*]\s*/, '').replace(/\*\*/g, '').trim();
                }).filter(text => text && text.length > 0);
            }
        }

        // Extract Tasks (✅ section) - ดึงทั้งหมด
        const taskMatch = summaryText.match(/✅[^:：\n]*[:：]\s*([\s\S]*?)(?=---|$)/);
        if (taskMatch) {
            const taskText = taskMatch[1].trim();
            if (taskText && taskText !== 'ไม่มี' && !taskText.includes('ไม่มี')) {
                const lines = taskText.split('\n')
                    .filter(line => line.trim() && !line.includes('ไม่มี') && line.trim() !== '');
                
                result.tasks = lines.map(line => {
                    const cleanLine = line.replace(/^[•\-\*]\s*/, '').replace(/\*\*/g, '').trim();
                    
                    const ownerMatch = cleanLine.match(/^([^:：]+)[：:]\s*(.+)/) ||
                                     cleanLine.match(/^(.+?)\s+(?:ต้อง|จะ|ช่วย)\s+(.+)/);
                    
                    if (ownerMatch) {
                        return {
                            owner: ownerMatch[1].trim(),
                            task: ownerMatch[2].replace(/["""']/g, '').trim()
                        };
                    }
                    
                    return {
                        owner: '—',
                        task: cleanLine.replace(/["""']/g, '').trim()
                    };
                });
            }
        }
    } catch (e) {
        console.warn('Parse error:', e);
    }

    return result;
}

// ============================================
// Render Report
// ============================================
function renderReport(parsed, stats, deptName, dateRangeText) {
    const contentArea = document.getElementById('contentArea');
    const now = new Date();

    // Update stats
    document.getElementById('statMessages').textContent = stats.messageCount || 0;
    document.getElementById('statParticipants').textContent = stats.participantCount || 0;
    document.getElementById('statAppointments').textContent = parsed.appointments.length;
    document.getElementById('statTasks').textContent = parsed.tasks.length;
    document.getElementById('footerTimestamp').textContent = `สร้างรายงานเมื่อ ${formatThaiDateTime(now)} น.`;

    let html = `
        <!-- Date Info -->
        <div class="date-info">
            <div>
                <i class="fas fa-calendar-alt"></i>
                <span class="date-range-badge">
                    <i class="fas fa-clock"></i> ${dateRangeText}
                </span>
            </div>
            <div>
                <i class="fas fa-file-alt"></i>
                ข้อความทั้งหมด ${stats.messageCount} ข้อความ
            </div>
        </div>

        <!-- Section 1: Topic -->
        <div class="section">
            <div class="section-header">
                <div class="section-icon icon-blue">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <h2>💬 สรุปใจความสำคัญ</h2>
            </div>
            <div class="topic-card">
                ${escapeHtml(parsed.topic)}
            </div>
        </div>
    `;

    // Section 2: Appointments
    html += `
        <div class="section">
            <div class="section-header">
                <div class="section-icon icon-orange">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <h2>📅 นัดหมาย (${parsed.appointments.length} รายการ)</h2>
            </div>
    `;

    if (parsed.appointments.length > 0) {
        html += '<div class="appointment-list">';
        parsed.appointments.forEach(appt => {
            const timeMatch = appt.match(/(\d{1,2}[.:]\d{2}|\d{1,2}\s*น\.|\d{1,2}\s*โมง|เช้า|บ่าย|เย็น|ค่ำ)/i);
            const timeStr = timeMatch ? timeMatch[0] : 'ไม่ระบุเวลา';
            
            html += `
                <div class="appointment-item">
                    <div class="appointment-time">
                        <i class="far fa-clock"></i> ${timeStr}
                    </div>
                    <div class="appointment-detail">
                        ${escapeHtml(appt)}
                    </div>
                </div>
            `;
        });
        html += '</div>';
    } else {
        html += `
            <div class="empty-state">
                <i class="fas fa-calendar-times"></i>
                <p>ไม่มีนัดหมายในช่วงเวลาที่เลือก</p>
            </div>
        `;
    }
    html += '</div>';

    // Section 3: Tasks
    html += `
        <div class="section">
            <div class="section-header">
                <div class="section-icon icon-green">
                    <i class="fas fa-check-square"></i>
                </div>
                <h2>✅ งานที่ต้องทำ (${parsed.tasks.length} รายการ)</h2>
            </div>
    `;

    if (parsed.tasks.length > 0) {
        html += `
            <table class="tasks-table">
                <thead>
                    <tr>
                        <th>ผู้รับผิดชอบ</th>
                        <th>รายละเอียดงาน</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        parsed.tasks.forEach(task => {
            html += `
                <tr>
                    <td>
                        <span class="owner-badge">
                            <i class="fas fa-user"></i> ${escapeHtml(task.owner)}
                        </span>
                    </td>
                    <td>${escapeHtml(task.task)}</td>
                </tr>
            `;
        });
        
        html += `
                </tbody>
            </table>
        `;
    } else {
        html += `
            <div class="empty-state">
                <i class="fas fa-check-circle"></i>
                <p>ไม่มีงานค้างในช่วงเวลาที่เลือก</p>
            </div>
        `;
    }
    html += '</div>';

    contentArea.innerHTML = html;
}

// ============================================
// Main Load Function
// ============================================
async function loadReport() {
    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
    
    if (!token) {
        window.location.href = '/login';
        return;
    }

    try {
        // Get user info
        const meRes = await fetch('/api/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!meRes.ok) throw new Error('ไม่สามารถดึงข้อมูลผู้ใช้');
        
        const meData = await meRes.json();
        if (!meData.success) throw new Error(meData.error || 'เกิดข้อผิดพลาด');

        const user = meData.user;
        const deptId = user.department_id;
        const deptName = user.department_name || 'ไม่ระบุแผนก';

        document.getElementById('deptNameDisplay').textContent = deptName;
        document.title = `รายงานแผนก ${deptName} - โรงพยาบาลเซนต์เมรี่`;

        // Get chat rooms
        const roomsRes = await fetch('/api/chat-rooms', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const roomsData = await roomsRes.json();
        const deptRoom = roomsData.rooms?.find(r => 
            r.room_type === 'department' && r.department_id == deptId
        );

        if (!deptRoom) {
            throw new Error('ไม่พบห้องสนทนาของแผนก');
        }

        // Set default dates if not set
        if (!currentStartDate || !currentEndDate) {
            const today = new Date();
            currentStartDate = today.toISOString().split('T')[0];
            currentEndDate = today.toISOString().split('T')[0];
            
            document.getElementById('startDateInput').value = currentStartDate;
            document.getElementById('endDateInput').value = currentEndDate;
        }

        // Format date range for display
        const startDisplay = new Date(currentStartDate).toLocaleDateString('th-TH');
        const endDisplay = new Date(currentEndDate).toLocaleDateString('th-TH');
        const dateRangeText = currentStartDate === currentEndDate 
            ? `วันที่ ${startDisplay}`
            : `ระหว่าง ${startDisplay} - ${endDisplay}`;

        // Get messages for stats
        const messagesRes = await fetch(`/api/chat-rooms/${deptRoom.room_id}/messages?limit=500`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        const messagesData = await messagesRes.json();
        
        // Filter messages by date range
        const startDateTime = new Date(currentStartDate).setHours(0,0,0,0);
        const endDateTime = new Date(currentEndDate).setHours(23,59,59,999);
        
        const filteredMessages = (messagesData.messages || []).filter(msg => {
            const msgDate = new Date(msg.created_at).getTime();
            return msgDate >= startDateTime && msgDate <= endDateTime;
        });

        const uniqueParticipants = new Set(filteredMessages.map(m => m.sender_id)).size;

        // Get AI Summary
        const summaryRes = await fetch('/api/chat-summary', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                room_id: deptRoom.room_id,
                message_count: 500,
                start_date: currentStartDate,
                end_date: currentEndDate
            })
        });

        const summaryData = await summaryRes.json();

        if (!summaryData.success) {
            if (summaryData.error?.includes('ไม่มีข้อความ')) {
                renderReport(
                    { topic: `ไม่มีข้อความในช่วง${dateRangeText}`, appointments: [], tasks: [] },
                    { messageCount: filteredMessages.length, participantCount: uniqueParticipants },
                    deptName,
                    dateRangeText
                );
                return;
            }
            throw new Error(summaryData.error || 'สร้างสรุปไม่สำเร็จ');
        }

        // Parse and render
        const parsed = parseDepartmentSummary(summaryData.summary);
        
        // If no appointments/tasks found, try to extract from messages
        if (parsed.appointments.length === 0 && parsed.tasks.length === 0) {
            const appointmentKeywords = ['นัด', 'ประชุม', 'พบ', 'เจอ', 'meeting'];
            const taskKeywords = ['ต้อง', 'ช่วย', 'รับผิดชอบ', 'ดำเนินการ', 'ทำ', 'ส่ง', 'แจ้ง'];
            
            filteredMessages.forEach(msg => {
                const text = msg.message_text || '';
                
                if (appointmentKeywords.some(k => text.includes(k))) {
                    parsed.appointments.push(`[${msg.full_name}] ${text.substring(0, 100)}`);
                }
                
                if (taskKeywords.some(k => text.includes(k))) {
                    parsed.tasks.push({
                        owner: msg.full_name,
                        task: text.substring(0, 100)
                    });
                }
            });
        }

        renderReport(parsed, {
            messageCount: filteredMessages.length,
            participantCount: uniqueParticipants
        }, deptName, dateRangeText);

    } catch (error) {
        console.error('Report error:', error);
        
        document.getElementById('contentArea').innerHTML = `
            <div class="empty-state">
                <i class="fas fa-exclamation-triangle" style="color: #e53e3e;"></i>
                <h3 style="color: #2d3748; margin-bottom: 10px;">เกิดข้อผิดพลาด</h3>
                <p style="color: #718096;">${escapeHtml(error.message)}</p>
                <button onclick="loadReport()" style="
                    margin-top: 20px;
                    padding: 10px 20px;
                    background: #1e5799;
                    color: white;
                    border: none;
                    border-radius: 30px;
                    cursor: pointer;
                ">
                    <i class="fas fa-sync-alt"></i> ลองอีกครั้ง
                </button>
            </div>
        `;
    }
}

// ============================================
// PDF Download - ปรับให้เป็น A4
// ============================================
function downloadPDF() {
    const btn = event.target.closest('button');
    const originalHTML = btn.innerHTML;
    
    btn.innerHTML = '<i class="fas fa-circle-notch spin"></i> กำลังสร้าง PDF...';
    btn.disabled = true;

    const deptName = document.getElementById('deptNameDisplay').textContent;
    const startDate = document.getElementById('startDateInput').value;
    const endDate = document.getElementById('endDateInput').value;
    const dateStr = startDate === endDate ? startDate : `${startDate}_to_${endDate}`;
    
    // ตั้งค่าสำหรับ A4
    const opt = {
        margin:        [0.5, 0.5, 0.5, 0.5], // บน, ขวา, ล่าง, ซ้าย (หน่วยเป็นนิ้ว)
        filename:      `รายงานแผนก_${deptName}_${dateStr}.pdf`,
        image:         { type: 'jpeg', quality: 0.98 },
        html2canvas:  { 
            scale: 2,
            useCORS: true,
            logging: false,
            letterRendering: true
        },
        jsPDF:        { 
            unit: 'in', 
            format: 'a4',      // กำหนดขนาด A4
            orientation: 'portrait' // แนวตั้ง
        },
        pagebreak: { mode: ['css', 'legacy'] } // ให้ตัดหน้าตาม CSS
    };
    
    html2pdf()
        .set(opt)
        .from(document.getElementById('reportContent'))
        .save()
        .then(() => {
            btn.innerHTML = originalHTML;
            btn.disabled = false;
        })
        .catch(err => {
            console.error('PDF error:', err);
            alert('ไม่สามารถสร้าง PDF ได้ กรุณาลองอีกครั้ง');
            btn.innerHTML = originalHTML;
            btn.disabled = false;
        });
}

document.addEventListener('DOMContentLoaded', () => {
    // Set default dates to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('startDateInput').value = today;
    document.getElementById('endDateInput').value = today;
    
    // Load report
    loadReport();
});
