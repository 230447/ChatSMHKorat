<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน | ระบบแชท</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: #999;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }

        input.error {
            border-color: #f56565;
            background: #fff5f5;
        }

        .error-message {
            color: #f56565;
            font-size: 13px;
            margin-top: 5px;
            padding-left: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #48bb78;
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            position: relative;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .button-loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: spin 1s linear infinite;
        }

        button.loading .button-text {
            visibility: hidden;
        }

        button.loading .button-loader {
            display: block;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .divider {
            color: #ddd;
        }

        .info-box {
            background: #ebf4ff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border-left: 4px solid #667eea;
        }

        .info-box p {
            color: #4a5568;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 5px;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        .info-box i {
            color: #667eea;
            margin-right: 5px;
        }
        .alert {
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.3s ease;
}

.alert.hidden {
    display: none;
}

.alert-success {
    background: rgba(46, 204, 113, 0.1);
    color: #27ae60;
    border: 1px solid rgba(46, 204, 113, 0.2);
}

.alert-error {
    background: rgba(231, 76, 60, 0.1);
    color: #e74c3c;
    border: 1px solid rgba(231, 76, 60, 0.2);
}

.alert i {
    font-size: 18px;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>📱 CHAT SMH Korat</h1>
            <p>ระบบแชทสำหรับบุคลากร</p>
        </div>

        <h2>🔐 ลืมรหัสผ่าน?</h2>
        <p class="subtitle">กรอกอีเมลของคุณ เราจะส่งรหัส 6 หลักสำหรับตั้งรหัสผ่านใหม่ให้คุณ</p>
        <div class="info-box">
            <p><i>📌</i> ระบบจะส่งรหัส 6 หลักไปยังอีเมลที่คุณลงทะเบียนไว้</p>  
            <p><i>⏱️</i> รหัสมีอายุ 10 นาที</p> 
            <p><i>📧</i> หากไม่พบอีเมล กรุณาตรวจสอบโฟลเดอร์ Spam</p>
        </div>

        

        <form id="forgotPasswordForm">
            <div id="alertMessage" class="alert hidden"></div>

            <div class="form-group">
                <label for="email">📧 อีเมล</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="กรุณากรอกอีเมลของคุณ"
                        required
                        autocomplete="email"
                    >
                </div>
                <div class="error-message" id="emailError"></div>
            </div>

            <button type="submit" id="submitBtn">
                <span class="button-text">ส่งรหัสยืนยัน 6 หลัก</span>
                <span class="button-loader"></span>
            </button>
        </form>

        <div class="links">
            <a href="/login.html">🔑 กลับไปหน้าเข้าสู่ระบบ</a>
            <span class="divider">|</span>
            <a href="/register.html">📝 ลงทะเบียน</a>
        </div>
    </div>

  <script>
document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const submitBtn = document.getElementById('submitBtn');
    const buttonText = submitBtn.querySelector('.button-text');
    const buttonLoader = submitBtn.querySelector('.button-loader');
    const originalText = buttonText.textContent;
    
    // แสดง loading
    submitBtn.disabled = true;
    buttonText.style.opacity = '0';
    buttonLoader.style.display = 'inline-block';

    try {
        console.log('📨 Sending forgot password request for:', email);
        
        const response = await fetch('/api/forgot-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
        });

        const data = await response.json();
        console.log('📥 Response:', data);

        if (data.success) {
            //  บันทึกอีเมลและไปหน้า verify code
            localStorage.setItem('reset_email', email);
            
            showMessage('✅ ' + data.message, 'success');
            
            // ไปหน้า verify-code หลังจาก 2 วินาที
            setTimeout(() => {
                window.location.href = 'verify-code.html';
            }, 2000);
        } else {
            showMessage('❌ ' + (data.message || 'เกิดข้อผิดพลาด'), 'error');
            resetButton();
        }
    } catch (error) {
        console.error('❌ Error:', error);
        showMessage('❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
        resetButton();
    }
});

function showMessage(text, type) {
    const alertDiv = document.getElementById('alertMessage');
    if (!alertDiv) {
        console.error('❌ Alert element not found');
        return;
    }
    
    // กำหนด icon ตาม type
    const icon = type === 'success' ? '✓' : '⚠️';
    
    alertDiv.className = `alert alert-${type}`;
    alertDiv.innerHTML = `<span>${icon}</span> ${text}`;
    alertDiv.classList.remove('hidden');
    
   
    alertDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    
    // ซ่อนอัตโนมัติหลังจาก 5 วินาที
    setTimeout(() => {
        alertDiv.classList.add('hidden');
    }, 5000);
}

function resetButton() {
    const submitBtn = document.getElementById('submitBtn');
    const buttonText = submitBtn.querySelector('.button-text');
    const buttonLoader = submitBtn.querySelector('.button-loader');
    
    submitBtn.disabled = false;
    buttonText.style.opacity = '1';
    buttonLoader.style.display = 'none';
}

// ตรวจสอบว่ามี email ใน localStorage หรือไม่ (ถ้ามีให้ลบ)
if (localStorage.getItem('reset_email')) {
    localStorage.removeItem('reset_email');
}
</script>
</body>
</html>
