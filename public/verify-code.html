<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันรหัส - ระบบแชท SMH</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 60px;
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            padding: 20px;
            border-radius: 50%;
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .email-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
        }

        .email-info i {
            color: #667eea;
            margin-right: 8px;
        }

        .email-info span {
            color: #333;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .code-input-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .code-digit {
            width: 60px;
            height: 70px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            font-family: monospace;
            transition: all 0.3s;
        }

        .code-digit:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .timer {
            text-align: center;
            font-size: 16px;
            color: #e74c3c;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .timer i {
            margin-right: 5px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .resend-link {
            text-align: center;
            margin-top: 20px;
        }

        .resend-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .resend-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.1);
            color: #27ae60;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .alert i {
            font-size: 18px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
            </div>
            
            <h2>ยืนยันรหัส 6 หลัก</h2>
            <p class="subtitle">กรุณากรอกรหัสที่ส่งไปยังอีเมลของคุณ</p>
            
            <div class="email-info">
                <i class="fas fa-envelope"></i>
                <span id="displayEmail">-</span>
            </div>

            <div id="alertMessage" class="hidden"></div>

            <div class="timer" id="timer">
                <i class="fas fa-hourglass-half"></i>
                <span id="timerDisplay">10:00</span>
            </div>

            <form id="verifyCodeForm">
                <div class="form-group">
                    <label>รหัสยืนยัน 6 หลัก</label>
                    <div class="code-input-container" id="codeInputs">
                        <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" autofocus>
                        <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                        <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                        <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                        <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                        <input type="text" class="code-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fas fa-check-circle"></i> ยืนยันรหัส
                </button>
            </form>

            <div class="resend-link">
                <a href="forgot-password.html">
                    <i class="fas fa-arrow-left"></i> ขอรหัสใหม่
                </a>
            </div>
        </div>
    </div>

    <script>
        // ตรวจสอบว่ามี email ใน localStorage หรือไม่
        const email = localStorage.getItem('reset_email');
        if (!email) {
            // ถ้าไม่มี email ให้กลับไปหน้า forgot-password
            window.location.href = 'forgot-password.html';
        }
        document.getElementById('displayEmail').textContent = email;

        // Timer 10 นาที
        let timeLeft = 10 * 60; // 10 นาที = 600 วินาที
        const timerDisplay = document.getElementById('timerDisplay');
        const timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerDisplay.textContent = '00:00';
                document.getElementById('timer').style.color = '#e74c3c';
                showMessage('หมดเวลายืนยัน กรุณาขอรหัสใหม่', 'error');
                document.getElementById('submitBtn').disabled = true;
            } else {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);

        // Auto-focus for code inputs
        const inputs = document.querySelectorAll('.code-digit');
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                // ถ้ากดตัวเลข
                if (e.key >= '0' && e.key <= '9') {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } 
                // ถ้ากด backspace
                else if (e.key === 'Backspace') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });

            // จัดการการวาง (paste)
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = e.clipboardData.getData('text');
                if (paste.length === 6 && /^\d+$/.test(paste)) {
                    paste.split('').forEach((char, i) => {
                        if (inputs[i]) {
                            inputs[i].value = char;
                        }
                    });
                    inputs[5].focus();
                }
            });

            // ป้องกันการพิมพ์ตัวอักษรที่ไม่ใช่ตัวเลข
            input.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Tab' || e.key === 'Backspace' || e.key === 'Delete') {
                    return; // อนุญาตปุ่มเหล่านี้
                }
                if (e.key < '0' || e.key > '9') {
                    e.preventDefault();
                }
            });
        });

        // Verify code
        document.getElementById('verifyCodeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // รวมรหัสจากทุกช่อง
            let code = '';
            inputs.forEach(input => {
                code += input.value;
            });
            
            // ตรวจสอบว่าครบ 6 หลักหรือไม่
            if (code.length !== 6 || !/^\d+$/.test(code)) {
                showMessage('กรุณากรอกรหัส 6 หลักให้ครบ', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบ...';

            try {
                const response = await fetch('/api/verify-reset-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        email: email,
                        code: code 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // บันทึก temp token
                    sessionStorage.setItem('reset_temp_token', data.temp_token);
                    
                    showMessage('รหัสถูกต้อง กำลังไปหน้าตั้งรหัสผ่านใหม่', 'success');
                    
                    // ไปหน้า reset-password
                    setTimeout(() => {
                        window.location.href = 'reset-password.html';
                    }, 1500);
                } else {
                    showMessage(data.message || 'รหัสไม่ถูกต้อง', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    
                    // เคลียร์ค่าและ focus ช่องแรก
                    inputs.forEach(input => input.value = '');
                    inputs[0].focus();
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('เกิดข้อผิดพลาด กรุณาลองใหม่', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        function showMessage(text, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${text}`;
            alertDiv.classList.remove('hidden');
            
            // ซ่อนอัตโนมัติหลังจาก 5 วินาที
            setTimeout(() => {
                alertDiv.classList.add('hidden');
            }, 5000);
        }

        // ล้าง timer เมื่อออกจากหน้า
        window.addEventListener('beforeunload', () => {
            clearInterval(timerInterval);
        });
    </script>
</body>
