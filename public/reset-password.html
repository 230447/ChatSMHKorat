<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ | ระบบแชท SMH</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo i {
            font-size: 60px;
            color: #667eea;
            background: rgba(102,126,234,0.1);
            padding: 20px;
            border-radius: 50%;
        }
        h2 { color: #333; font-size: 24px; margin-bottom: 10px; text-align: center; }
        .subtitle { color: #666; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-size: 14px; font-weight: 500; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 15px; color: #999; font-size: 16px; z-index: 1; }
        .toggle-password {
            position: absolute; right: 15px;
            color: #999; cursor: pointer; font-size: 16px; z-index: 1;
        }
        .toggle-password:hover { color: #667eea; }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Prompt', sans-serif;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        .password-strength {
            margin-top: 8px; height: 5px;
            border-radius: 10px; background: #e0e0e0; overflow: hidden;
        }
        .strength-bar { height: 100%; width: 0; transition: all 0.4s; border-radius: 10px; }
        .strength-text { font-size: 12px; margin-top: 4px; text-align: right; color: #888; }
        .requirements {
            background: #f7fafc; border-radius: 12px;
            padding: 15px; margin: 15px 0; font-size: 13px;
        }
        .requirements p { margin-bottom: 8px; font-weight: 500; color: #4a5568; }
        .requirements ul { list-style: none; padding: 0; }
        .requirements li {
            margin-bottom: 5px; padding-left: 22px;
            position: relative; color: #e74c3c; transition: color 0.3s;
        }
        .requirements li::before { content: "✗"; position: absolute; left: 0; font-weight: bold; }
        .requirements li.valid { color: #27ae60; }
        .requirements li.valid::before { content: "✓"; }
        .btn {
            width: 100%; padding: 15px; border: none;
            border-radius: 12px; font-size: 16px; font-weight: 600;
            font-family: 'Prompt', sans-serif; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; transition: all 0.3s; margin-top: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .alert {
            padding: 12px 15px; border-radius: 10px;
            margin-bottom: 20px; display: flex;
            align-items: center; gap: 10px; font-size: 14px;
        }
        .alert.hidden { display: none; }
        .alert-success {
            background: rgba(46,204,113,0.1); color: #27ae60;
            border: 1px solid rgba(46,204,113,0.3);
        }
        .alert-error {
            background: rgba(231,76,60,0.1); color: #e74c3c;
            border: 1px solid rgba(231,76,60,0.3);
        }
        .links { text-align: center; margin-top: 25px; }
        .links a { color: #667eea; text-decoration: none; font-size: 14px; margin: 0 8px; }
        .links a:hover { text-decoration: underline; }
        .divider { color: #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><i class="fas fa-lock"></i></div>
        <h2>ตั้งรหัสผ่านใหม่</h2>
        <p class="subtitle">กรุณาตั้งรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>

        
        <div id="alertMessage" class="alert hidden"></div>

     
        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="newPassword"><i class="fas fa-key"></i> รหัสผ่านใหม่</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                 
                    <input type="password" id="newPassword" placeholder="รหัสผ่านใหม่อย่างน้อย 6 ตัว" required autocomplete="new-password">
                    <i class="fas fa-eye toggle-password" id="toggleNew" onclick="togglePassword('newPassword','toggleNew')"></i>
                </div>
                <div class="password-strength">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><i class="fas fa-check-circle"></i> ยืนยันรหัสผ่านใหม่</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="กรอกรหัสผ่านอีกครั้ง" required autocomplete="new-password">
                    <i class="fas fa-eye toggle-password" id="toggleConfirm" onclick="togglePassword('confirmPassword','toggleConfirm')"></i>
                </div>
            </div>

            <div class="requirements">
                <p>รหัสผ่านต้องมีอย่างน้อย:</p>
                <ul>
                    <li id="req-length">6 ตัวอักษร</li>
                    <li id="req-number">ตัวเลข 1 ตัว (0-9)</li>
                    <li id="req-lower">ตัวพิมพ์เล็ก 1 ตัว (a-z)</li>
                    <li id="req-upper">ตัวพิมพ์ใหญ่ 1 ตัว (A-Z)</li>
                </ul>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                <i class="fas fa-save" id="btnIcon"></i>
                <span id="btnText">บันทึกรหัสผ่านใหม่</span>
            </button>
        </form>

        <div class="links">
            <a href="/login.html"><i class="fas fa-arrow-left"></i> กลับหน้าเข้าสู่ระบบ</a>
            <span class="divider">|</span>
            <a href="/forgot-password.html">ขอรับรหัสใหม่</a>
        </div>
    </div>

    <script>
        //  ตรวจสอบ temp token
        const tempToken = sessionStorage.getItem('reset_temp_token');
        if (!tempToken) {
            alert('หมดเวลา หรือไม่พบรหัสยืนยัน กรุณาเริ่มใหม่');
            window.location.href = '/forgot-password.html';
        }

        //  Toggle แสดง/ซ่อนรหัสผ่าน
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        //  ตรวจสอบความแข็งแกร่งรหัสผ่าน
        document.getElementById('newPassword').addEventListener('input', function () {
            const val = this.value;
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            document.getElementById('req-length').classList.toggle('valid', val.length >= 6);
            document.getElementById('req-number').classList.toggle('valid', /[0-9]/.test(val));
            document.getElementById('req-lower').classList.toggle('valid', /[a-z]/.test(val));
            document.getElementById('req-upper').classList.toggle('valid', /[A-Z]/.test(val));

            let score = 0;
            if (val.length >= 6) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[a-z]/.test(val)) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;

            const colors = ['', '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#27ae60'];
            const labels = ['', 'อ่อนมาก', 'อ่อน', 'ปานกลาง', 'แข็งแกร่ง', 'แข็งแกร่งมาก'];
            bar.style.width = (score / 5 * 100) + '%';
            bar.style.background = colors[score] || '#e0e0e0';
            text.textContent = score > 0 ? `ความแข็งแกร่ง: ${labels[score]}` : '';
            text.style.color = colors[score] || '#888';
        });

        //  Submit ฟอร์ม
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password.length < 6) {
                showAlert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showAlert('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            submitBtn.disabled = true;
            btnIcon.className = 'fas fa-spinner fa-spin';
            btnText.textContent = 'กำลังบันทึก...';

            try {
                const response = await fetch('/api/reset-password-with-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ temp_token: tempToken, password })
                });

                const data = await response.json();

                if (data.success) {
                    sessionStorage.removeItem('reset_temp_token');
                    localStorage.removeItem('reset_email');
                    showAlert('เปลี่ยนรหัสผ่านสำเร็จ! กำลังนำไปหน้าเข้าสู่ระบบ...', 'success');
                    setTimeout(() => { window.location.href = '/login.html'; }, 2000);
                } else {
                    showAlert(data.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่', 'error');
                    submitBtn.disabled = false;
                    btnIcon.className = 'fas fa-save';
                    btnText.textContent = 'บันทึกรหัสผ่านใหม่';
                }
            } catch (err) {
                showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                submitBtn.disabled = false;
                btnIcon.className = 'fas fa-save';
                btnText.textContent = 'บันทึกรหัสผ่านใหม่';
            }
        });

        function showAlert(text, type) {
            const el = document.getElementById('alertMessage');
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            el.className = `alert alert-${type}`;
            el.innerHTML = `<i class="fas ${icon}"></i> ${text}`;
            el.classList.remove('hidden');
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            if (type === 'error') setTimeout(() => el.classList.add('hidden'), 6000);
        }
    </script>
</body>
</html>
